; hfr 通用高刷插件配置 —— 与 d3d9.dll 一同放在游戏 exe 同目录
; 当前内置 profile：TH15 东方绀珠传（冻结签名自动识别，不限制 exe
; 修订号/语言版本；其它游戏放入本 DLL 时仅作透明代理，不会改动游戏）
[hfr]
; 目标刷新率：0 = 跟随显示器；>0 = 强制指定（如 120/144/240）
fps=0
; 垂直同步：1 = Present 间隔一（推荐，由显示器节奏驱动）；0 = 插件软件限帧
vsync=1
; 子步长解耦：1 = 弹幕/自机/道具等按显示率子步进（真正高刷平滑）
;             0 = 逻辑保持 60Hz，仅提高呈现率（画面重复，等同原版手感）
substep=1
; 写 hfr.log 日志
log=1
; 独占全屏请求的刷新率（Hz），0 = 自动取显示器当前刷新率
fullscreen_refresh=0
; 调试输出
debug=0
; 子 tick 输入：1 = 方向/focus 按显示率采样（高刷下更跟手）
subtick_input=1
; 敌机/精灵视觉插值：1 = 敌机在 60Hz 帧位置间平滑插值（纯视觉，不动判定）
enemy_interp=1
; 擦弹表现：子弹着色抖动（纯视觉）
graze_bullets=1
; 擦弹表现：自机辉光（纯视觉）
graze_glow=1
